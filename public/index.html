<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MY WORLD · 온라인 2D 월드</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">MY WORLD <span class="online-dot"></span></div>
        <div class="subtitle">함께 만나는 작은 온라인 세계</div>
      </div>
      <div class="status"><span id="connectionDot"></span><span id="connectionText">서버 연결 중…</span></div>
    </header>

    <section class="world-wrap">
      <div id="game"></div>
      <div class="help">이동: WASD / 방향키 · 채팅: 아래 입력창</div>
      <div id="mobile-controls">
  <button type="button" data-dir="up">▲</button>
  <button type="button" data-dir="left">◀</button>
  <button type="button" data-dir="down">▼</button>
  <button type="button" data-dir="right">▶</button>
</div>
      <div class="name-card">
        <label for="playerName">내 이름</label>
        <input id="playerName" maxlength="16" value="탐험가" autocomplete="off">
        <button id="saveName">변경</button>
      </div>
    </section>

    <section class="bottom">
      <div class="chat-panel">
        <div class="panel-title">💬 월드 채팅 <span id="peopleCount">접속자 0명</span></div>
        <div id="messages" aria-live="polite">
          <div class="system-message">MY WORLD에 오신 것을 환영합니다. 다른 사람이 접속하면 함께 대화할 수 있어요.</div>
        </div>
        <form id="chatForm">
          <input id="chatInput" maxlength="180" placeholder="메시지를 입력하고 Enter…" autocomplete="off">
          <button type="submit">전송</button>
        </form>
      </div>
      <aside class="guide">
        <div class="panel-title">🌿 월드 안내</div>
        <p>넓은 초원과 작은 연못이 있는 2D 공간입니다.</p>
        <p>다른 사용자가 접속하면 캐릭터가 실시간으로 나타납니다.</p>
        <p class="small">공개 배포 전에는 채팅 신고·차단, 개인정보 보호 등 운영 기능을 추가하는 것을 권장합니다.</p>
      </aside>
    </section>
    <footer>MY WORLD · 웹 브라우저에서 플레이 · 공개 배포는 서버 설정이 필요합니다.</footer>
  </main>
  <script src="/client.js"></script>
